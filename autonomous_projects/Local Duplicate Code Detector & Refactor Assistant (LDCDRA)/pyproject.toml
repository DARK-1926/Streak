[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-tool"
version = "0.1.0"
description = "A simple refactoring tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
Refactor = "refactor:main"