<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentinel‑Scope Dashboard</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f9f9f9;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
        padding: 12px 15px;
        border: 1px solid #ddd;
        text-align: left;
    }
    th {
        background-color: #e0e0e0;
        color: #333;
        font-weight: bold;
    }
    tr:nth-child(even) {
        background-color: #f5f5f5;
    }
    tr:hover {
        background-color: #e9e9e9;
    }
</style>
</head>
<body>
<h1>Sentinel‑Scope Anomaly Dashboard</h1>
<table id="anomalyTable">
    <thead>
        <tr>
            <th>User Agent</th>
            <th>Count</th>
            <th>Last Seen</th>
        </tr>
    </thead>
    <tbody>
        <!-- Data rows will be inserted here -->
    </tbody>
</table>
<script>
    const tableBody = document.querySelector('#anomalyTable tbody');

    function fetchAnomalies() {
        fetch('/anomalies')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                tableBody.innerHTML = '';
                data.forEach(item => {
                    const row = document.createElement('tr');

                    const uaCell = document.createElement('td');
                    uaCell.textContent = item.user_agent || 'Unknown';

                    const countCell = document.createElement('td');
                    countCell.textContent = item.count !== undefined ? item.count : '0';

                    const lastSeenCell = document.createElement('td');
                    lastSeenCell.textContent = item.last_seen
                        ? new Date(item.last_seen).toLocaleString()
                        : 'N/A';

                    row.appendChild(uaCell);
                    row.appendChild(countCell);
                    row.appendChild(lastSeenCell);

                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error fetching anomalies:', error);
            });
    }

    fetchAnomalies();
    setInterval(fetchAnomalies, 30000);
</script>
</body>
</html>
