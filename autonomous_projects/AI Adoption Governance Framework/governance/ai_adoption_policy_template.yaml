ai_adoption_policy: &policy
  version: "1.0"
  scope: "All AI implementations across the organization"
  principles:
    - name: "Human Oversight"
      description: "AI decisions requiring human judgment must be reviewable"
    - name: "Data Privacy"
      description: "No sensitive data sharing with third-party models without explicit consent"
    - name: "Transparency"
      description: "Model decisions must be explainable to stakeholders"
    - name: "Fairness"
      description: "AI systems must be tested for bias across demographic groups"
  approval_process:
    - risk_assessment_required: "High and Medium risk AI systems"
    - executive_review: "All AI projects must be reviewed by AI Governance Board"
    - documentation_mandatory: "All AI projects require implementation documentation"
  monitoring:
    - continuous_monitoring: "Deployed AI systems must be monitored for drift"
    - incident_reporting: "AI-related incidents must be reported within 24 hours"
