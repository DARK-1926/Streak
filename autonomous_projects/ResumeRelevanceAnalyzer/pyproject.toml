[project]
name = "resumerelevanceanalyzer"
version = "0.1.0"
description = "Analyze resume relevance against job descriptions using keyword matching and section-aware scoring"
readme = "README.md"
authors = [{name = "ResumeRelevanceAnalyzer Team"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
resumerelevance = "src.cli:main"
[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]