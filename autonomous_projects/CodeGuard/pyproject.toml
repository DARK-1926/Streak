[project]
name = "codeguard"
version = "0.1.0"
description = "CodeGuard: Detecting duplicate test cases in Python projects."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
dependencies = [
    "simhash==2.1.2",
    "click>=8.0",
    "rich>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "mypy>=0.971"
]

[project.scripts]
codeguard = "codeguard:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"